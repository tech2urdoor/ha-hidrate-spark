name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: "false"

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Every file compiles
        run: python -m compileall -q custom_components tests
      - name: Tests
        run: python tests/test_hidrate_spark.py

  imports:
    name: Loads in Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Home Assistant and what its bluetooth integration needs
        run: |
          pip install homeassistant
          python tests/check_imports.py --requirements > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt"
      - name: Every module imports
        run: python tests/check_imports.py
      - name: Coordinator tests
        run: python tests/test_coordinator.py

  relay-app:
    name: Phone relay app builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Tests and a debug build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
